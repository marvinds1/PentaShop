[project]
name = "pentashop"
version = "1.0.0"
description = "Small multi-seller e-commerce web app built with Flask, Jinja and MySQL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "dbutils>=3.2.0",
    "flask>=3.1.3",
    "flask-limiter>=4.1.1",
    "flask-wtf>=1.3.0",
    "geopy>=2.5.0",
    "pymysql>=1.2.4",
    "python-dotenv>=1.2.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
